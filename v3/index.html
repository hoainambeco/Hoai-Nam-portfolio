    <script>
      // Apply the theme and language before first paint so there is no flash.
      // Light first: only a saved choice turns dark on. Own keys: the other
      // versions share this origin and store their own defaults.
      (function () {
        var d = document.documentElement;
        var theme = 'light';
        var lang = null;
        try {
          if (localStorage.getItem('portfolio-pro:theme') === 'dark') theme = 'dark';
          lang = localStorage.getItem('portfolio-pro:lang');
        } catch (e) {}
        var q = new URLSearchParams(location.search).get('lang');
        if (q === 'vi' || q === 'en') lang = q;
        if (!lang) lang = /^vi/i.test(navigator.language || '') ? 'vi' : 'en';
        d.dataset.theme = theme;
        d.lang = lang;
      })();
    </script>
